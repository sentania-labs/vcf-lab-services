name: vcf-services

services:
  bootstrap:
    container_name: vcf-services-bootstrap
    image: ${VCF_SERVICES_UI_IMAGE:-ghcr.io/sentania-labs/vcf-lab-services/ui:latest}
    restart: "no"
    command: ["python", "/app/bootstrap.py"]
    environment:
      CONFIG_DIR: /config
      SECRETS_DIR: /secrets
    volumes:
      - config_state:/config:rw
      - secrets_state:/secrets:rw
    networks:
      - control

  depot-web:
    container_name: vcf-services-depot-web
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    init: true
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - depot_store:/depot:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - control
    depends_on:
      admin-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  depot-sync:
    container_name: vcf-services-sync
    image: ${VCF_SERVICES_SYNC_IMAGE:-ghcr.io/sentania-labs/vcf-lab-services/sync-base:latest}
    restart: unless-stopped
    environment:
      SETTINGS_FILE: /etc/vcf-services/settings.env
      STATE_DIR: /state
      DEPOT_DIR: /depot
      AUTH_FILE: /run/secrets/activation-code.txt
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis-password
      TOOL_ROOT: /opt/vcfdt/current
      VCFDT_TOOL_STORE: /opt/vcfdt
    volumes:
      - depot_store:/depot:rw
      - vcfdt_tool:/opt/vcfdt:ro
      - vcfdt_state:/root/.local/share/vmware/vdt
      - sync_state:/state:rw
      - config_state:/etc/vcf-services:ro
      - secrets_state:/run/secrets:ro
    networks:
      - control
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /state/state.json && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  sftp-backup:
    container_name: vcf-services-sftp
    image: ${VCF_SERVICES_SFTP_IMAGE:-ghcr.io/sentania-labs/vcf-lab-services/sftp:latest}
    restart: unless-stopped
    init: true
    environment:
      SETTINGS_FILE: /config/settings.env
      SFTP_PASSWORD_FILE: /run/secrets/sftp-password
    ports:
      - "2222:22"
    volumes:
      - backup_store:/mnt/backup:rw
      - sftp_host_keys:/etc/ssh/keys:rw
      - config_state:/config:ro
      - secrets_state:/run/secrets:ro
    networks:
      - control
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/sftp-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  admin-ui:
    container_name: vcf-services-ui
    image: ${VCF_SERVICES_UI_IMAGE:-ghcr.io/sentania-labs/vcf-lab-services/ui:latest}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      depot-sync:
        condition: service_healthy
    environment:
      DEPOT_DIR: /depot
      STATE_DIR: /state
      SETTINGS_FILE: /config/settings.env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis-password
      VCFDT_STORE: /opt/vcfdt
      AUTH_FILE: /run/secrets/auth.json
      ACTIVATION_CODE_FILE: /run/secrets/activation-code.txt
      FLASK_SECRET_FILE: /run/secrets/flask-secret
    volumes:
      - depot_store:/depot:ro
      - backup_store:/mnt/backup:ro
      - caddy_data:/caddy-data:ro
      - vcfdt_tool:/opt/vcfdt:rw
      - vcfdt_state:/root/.local/share/vmware/vdt:rw
      - sync_state:/state:ro
      - config_state:/config:rw
      - secrets_state:/run/secrets:rw
    networks:
      - control
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  redis:
    container_name: vcf-services-redis
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf"]
    volumes:
      - secrets_state:/etc/redis:ro
    networks:
      - control
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /etc/redis/redis-password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  control:
    driver: bridge

volumes:
  depot_store:
    name: ${DEPOT_VOLUME_NAME:-vcf-services-depot-store}
  backup_store:
    name: ${BACKUP_VOLUME_NAME:-vcf-services-backup-store}
  vcfdt_state:
    name: vcf-services-vcfdt-state
  vcfdt_tool:
    name: vcf-services-vcfdt-tool
  sync_state:
    name: vcf-services-sync-state
  caddy_data:
    name: vcf-services-caddy-data
  caddy_config:
    name: vcf-services-caddy-config
  sftp_host_keys:
    name: vcf-services-sftp-host-keys
  config_state:
    name: vcf-services-config
  secrets_state:
    name: vcf-services-secrets
