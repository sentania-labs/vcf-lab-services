name: vcf-services

services:
  depot-web:
    container_name: vcf-services-depot-web
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    init: true
    env_file:
      - secrets/caddy.env
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - depot_store:/depot:ro
      - ./secrets/tls:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - control
    depends_on:
      admin-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  depot-sync:
    container_name: vcf-services-sync
    image: vcf-services-sync:local
    restart: unless-stopped
    environment:
      SETTINGS_FILE: /etc/vcf-services/settings.env
      STATE_DIR: /state
      DEPOT_DIR: /depot
      AUTH_FILE: /run/secrets/activation-code.txt
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis/password
    volumes:
      - depot_store:/depot:rw
      - vcfdt_state:/root/.local/share/vmware/vdt
      - sync_state:/state:rw
      - ./config:/etc/vcf-services:ro
      - ./secrets:/run/secrets:ro
    networks:
      - control
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /state/state.json && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  admin-ui:
    container_name: vcf-services-ui
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: vcf-services-ui:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      depot-sync:
        condition: service_healthy
    environment:
      DEPOT_DIR: /depot
      STATE_DIR: /state
      SETTINGS_FILE: /config/settings.env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/redis/password
    volumes:
      - depot_store:/depot:ro
      - sync_state:/state:ro
      - ./config:/config
      - ./secrets/redis:/run/redis:ro
    networks:
      - control
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  redis:
    container_name: vcf-services-redis
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf"]
    volumes:
      - ./secrets/redis:/etc/redis:ro
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /etc/redis/password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  control:
    driver: bridge

volumes:
  depot_store:
    name: ${DEPOT_VOLUME_NAME:-vcf-services-depot-store}
    driver: local
    driver_opts:
      type: ${DEPOT_VOLUME_TYPE:-none}
      o: ${DEPOT_VOLUME_OPTIONS:-bind}
      device: ${DEPOT_VOLUME_DEVICE:-/var/lib/vcf-services/depot}
  vcfdt_state:
    name: vcf-services-vcfdt-state
    external: true
  sync_state:
    name: vcf-services-sync-state
  caddy_data:
    name: vcf-services-caddy-data
  caddy_config:
    name: vcf-services-caddy-config
