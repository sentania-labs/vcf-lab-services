name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  checks:
    name: Release gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish product images
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Decide whether this tag owns the latest tags
        id: latest
        run: |
          highest="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is the highest published version; it will own the latest tags."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is behind $highest; the latest tags stay on $highest."
          fi

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and verify publishable images
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
          PUBLISH_LATEST: ${{ steps.latest.outputs.publish }}
        run: |
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$GITHUB_REF_NAME"
          docker build --pull \
            --build-arg "VCF_SERVICES_VERSION=$version" \
            --build-arg "VCF_SERVICES_REVISION=$GITHUB_SHA" \
            --build-arg "VCF_SERVICES_SOURCE=$SOURCE_URL" \
            --file Dockerfile.ui \
            --tag "$image_root/ui:$version" .
          docker build --pull \
            --build-arg "VCF_SERVICES_VERSION=$version" \
            --build-arg "VCF_SERVICES_REVISION=$GITHUB_SHA" \
            --build-arg "VCF_SERVICES_SOURCE=$SOURCE_URL" \
            --file Dockerfile.sync-base \
            --tag "$image_root/sync-base:$version" .
          docker build --pull \
            --build-arg "VCF_SERVICES_VERSION=$version" \
            --build-arg "VCF_SERVICES_REVISION=$GITHUB_SHA" \
            --build-arg "VCF_SERVICES_SOURCE=$SOURCE_URL" \
            --file Dockerfile.sftp \
            --tag "$image_root/sftp:$version" .
          ./scripts/verify-license-boundary.sh "$image_root/sync-base:$version"
          test "$(docker image inspect "$image_root/ui:$version" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$version"
          test "$(docker image inspect "$image_root/sync-base:$version" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$version"
          test "$(docker image inspect "$image_root/sftp:$version" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$version"
          if [ "$PUBLISH_LATEST" = true ]; then
            docker tag "$image_root/ui:$version" "$image_root/ui:latest"
            docker tag "$image_root/sync-base:$version" "$image_root/sync-base:latest"
            docker tag "$image_root/sftp:$version" "$image_root/sftp:latest"
          fi

      - name: Push product images
        env:
          PUBLISH_LATEST: ${{ steps.latest.outputs.publish }}
        run: |
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$GITHUB_REF_NAME"
          docker push "$image_root/ui:$version"
          docker push "$image_root/sync-base:$version"
          docker push "$image_root/sftp:$version"
          if [ "$PUBLISH_LATEST" = true ]; then
            docker push "$image_root/ui:latest"
            docker push "$image_root/sync-base:latest"
            docker push "$image_root/sftp:latest"
          else
            echo "Skipped the latest tags because a higher version is already published."
          fi

      # This product is public and its installer pulls without credentials, so
      # all container packages are intentionally public. A package that GHCR
      # created as private on first publish blocks every operator install, so
      # public visibility is a hard gate before the release is created.
      - name: Publish and verify public package visibility
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN || github.token }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          owner_type="$(gh api "/users/$owner" --jq .type)"
          failed=0
          for component in ui sync-base sftp; do
            package="$repo/$component"
            encoded="${package//\//%2F}"
            if [ "$owner_type" = Organization ]; then
              base="/orgs/$owner/packages/container/$encoded"
            else
              base="/users/$owner/packages/container/$encoded"
            fi
            if ! gh api --method PATCH "$base/visibility" -f visibility=public >/dev/null 2>&1; then
              echo "Could not set visibility through the API for $package; verifying current state instead."
            fi
            visibility="$(gh api "$base" --jq .visibility 2>/dev/null || echo unknown)"
            if [ "$visibility" != public ]; then
              echo "ERROR: GHCR package $package is '$visibility', not public." >&2
              echo "       Operators install without registry credentials, so a private package" >&2
              echo "       breaks every install. Set the package to public under the repository's" >&2
              echo "       Packages page, or add a GHCR_VISIBILITY_TOKEN secret with admin:packages," >&2
              echo "       then re-run this job." >&2
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Prove a credential-free pull works
        run: |
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$GITHUB_REF_NAME"
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" docker pull "$image_root/ui:$version"
          DOCKER_CONFIG="$anonymous_config" docker pull "$image_root/sync-base:$version"
          DOCKER_CONFIG="$anonymous_config" docker pull "$image_root/sftp:$version"

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Package installer entry point
        run: |
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          ./scripts/package-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release" "$image_root"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$GITHUB_REF_NAME"
          gh release create "$version" \
            "$RUNNER_TEMP/release/install.sh#Installer entry point" \
            "$RUNNER_TEMP/release/vcf-lab-services-$version.tar.gz#Installation bundle" \
            "$RUNNER_TEMP/release/vcf-lab-services-$version.tar.gz.sha256#Installation bundle checksum" \
            --verify-tag \
            --generate-notes \
            --title "$version"
